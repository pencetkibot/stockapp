<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>Edit Baris {{ index }} / {{ total }}</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --kb-offset: 0px;
      }
      html,
      body {
        height: 100%;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        background-color: #f4f4f9;
        padding: 8px;
        display: flex;
        justify-content: center;
        min-height: 100dvh;
        overflow: hidden;
        padding-bottom: calc(8px + var(--kb-offset));
      }
      .container {
        width: 100%;
        max-width: 500px;
        background: white;
        padding: 10px;
        border-radius: 12px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        max-height: calc(100dvh - 16px - var(--kb-offset));
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .content {
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .progress-bar-bg {
        background-color: #e9ecef;
        border-radius: 10px;
        height: 6px;
        width: 100%;
        margin-bottom: 8px;
        overflow: hidden;
      }
      .progress-bar-fill {
        background-color: #007bff;
        height: 100%;
        transition: width 0.3s ease;
      }
      .progress-text {
        color: #555;
        font-size: 0.82rem;
        margin-bottom: 8px;
        font-weight: 600;
        display: flex;
        justify-content: space-between;
      }
      h3 {
        font-size: 0.98rem;
        margin-bottom: 6px;
        color: #333;
      }
      .table-wrap {
        overflow: auto;
        -webkit-overflow-scrolling: touch;
        border-radius: 8px;
        border: 1px solid #f0f0f0;
      }
      .read-only-table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 0;
        font-size: 0.86rem;
      }
      .read-only-table tr {
        border-bottom: 1px solid #eee;
      }
      .read-only-table th,
      .read-only-table td {
        padding: 7px 6px;
        text-align: left;
        vertical-align: top;
        word-break: break-word; /* Mencegah teks panjang merusak layout */
      }
      .read-only-table th {
        color: #666;
        width: 38%;
        font-weight: 600;
        background-color: #fafafa;
      }
      .editor-form {
        position: sticky;
        bottom: 0;
        margin-top: 8px;
        background: white;
        padding-top: 6px;
      }
      .active-field {
        background-color: #e8f4f8;
        padding: 10px;
        border-radius: 8px;
        border-left: 4px solid #007bff;
      }
      .active-field label {
        display: block;
        font-size: 0.86rem;
        color: #004085;
        margin-bottom: 5px;
      }
      input[type="text"] {
        width: 100%;
        padding: 10px;
        border: 1px solid #b8daff;
        border-radius: 6px;
        font-size: 16px;
        background: white;
      }
      button {
        background-color: #007bff;
        color: white;
        border: none;
        padding: 11px;
        border-radius: 8px;
        font-size: 0.94rem;
        font-weight: bold;
        cursor: pointer;
        width: 100%;
        margin-top: 8px;
        transition: background 0.2s;
      }
      button:active {
        background-color: #0056b3;
      }

      @media (max-height: 620px) {
        .container {
          border-radius: 10px;
        }
        .table-wrap {
          max-height: 42dvh;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="content">
        <!-- Progress Bar Visual -->
        <div class="progress-bar-bg">
          <div
            class="progress-bar-fill"
            style="width: {{ (index / total) * 100 }}%;"
          ></div>
        </div>

        <div class="progress-text">
          <span>Baris {{ index }} dari {{ total }}</span>
          <span>{{ ((index / total) * 100)|round|int }}%</span>
        </div>

        <h3>Informasi Referensi</h3>
        <div class="table-wrap">
          <table class="read-only-table">
            {% for col_name in display_columns %}
            <tr>
              <th>{{ col_name }}</th>
              <td>{{ row[col_name] }}</td>
            </tr>
            {% endfor %}
          </table>
        </div>
      </div>

      <form action="/edit" method="POST" class="editor-form">
        <div class="active-field">
          <label><strong>Edit Kolom [ {{ target_column }} ] :</strong></label>
          <!-- inputmode="text" mempermudah keyboard HP muncul secara optimal -->
          <input
            type="text"
            name="target_value"
            value="{{ row[target_column] }}"
            inputmode="text"
            autofocus
            required
            autocomplete="off"
          />
        </div>
        <button type="submit">Simpan & Lanjut ➔</button>
      </form>
    </div>

    <script>
      (function () {
        const root = document.documentElement;
        const fieldInput = document.querySelector('input[name="target_value"]');

        const updateKeyboardOffset = () => {
          const vv = window.visualViewport;
          if (!vv) return;
          const offset = Math.max(
            0,
            window.innerHeight - vv.height - vv.offsetTop,
          );
          root.style.setProperty("--kb-offset", offset + "px");
        };

        const keepInputVisible = () => {
          if (!fieldInput) return;
          setTimeout(() => {
            fieldInput.scrollIntoView({ block: "center", behavior: "smooth" });
          }, 80);
        };

        if (window.visualViewport) {
          window.visualViewport.addEventListener("resize", () => {
            updateKeyboardOffset();
            keepInputVisible();
          });
          window.visualViewport.addEventListener(
            "scroll",
            updateKeyboardOffset,
          );
        }

        if (fieldInput) {
          fieldInput.addEventListener("focus", () => {
            updateKeyboardOffset();
            keepInputVisible();
          });
        }

        updateKeyboardOffset();
      })();
    </script>
  </body>
</html>
