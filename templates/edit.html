<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Baris {{ index }} / {{ total }}</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        background-color: #f4f4f9;
        padding: 12px;
        display: flex;
        justify-content: center;
      }
      .container {
        width: 100%;
        max-width: 500px;
        background: white;
        padding: 16px;
        border-radius: 12px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        margin-top: 8px;
        margin-bottom: 24px;
      }
      .progress-bar-bg {
        background-color: #e9ecef;
        border-radius: 10px;
        height: 8px;
        width: 100%;
        margin-bottom: 12px;
        overflow: hidden;
      }
      .progress-bar-fill {
        background-color: #007bff;
        height: 100%;
        transition: width 0.3s ease;
      }
      .progress-text {
        color: #555;
        font-size: 0.9rem;
        margin-bottom: 16px;
        font-weight: 600;
        display: flex;
        justify-content: space-between;
      }
      h3 {
        font-size: 1.1rem;
        margin-bottom: 10px;
        color: #333;
      }
      .read-only-table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 20px;
        font-size: 0.95rem;
      }
      .read-only-table tr {
        border-bottom: 1px solid #eee;
      }
      .read-only-table th,
      .read-only-table td {
        padding: 10px 8px;
        text-align: left;
        vertical-align: top;
        word-break: break-word; /* Mencegah teks panjang merusak layout */
      }
      .read-only-table th {
        color: #666;
        width: 40%;
        font-weight: 600;
        background-color: #fafafa;
      }
      .active-field {
        background-color: #e8f4f8;
        padding: 16px;
        border-radius: 8px;
        border-left: 5px solid #007bff;
      }
      .active-field label {
        display: block;
        font-size: 0.95rem;
        color: #004085;
        margin-bottom: 6px;
      }
      input[type="text"] {
        width: 100%;
        padding: 12px;
        border: 1px solid #b8daff;
        border-radius: 6px;
        font-size: 1rem;
        background: white;
      }
      button {
        background-color: #007bff;
        color: white;
        border: none;
        padding: 14px;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: bold;
        cursor: pointer;
        width: 100%;
        margin-top: 16px;
        transition: background 0.2s;
      }
      button:active {
        background-color: #0056b3;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- Progress Bar Visual -->
      <div class="progress-bar-bg">
        <div
          class="progress-bar-fill"
          style="width: {{ (index / total) * 100 }}%;"
        ></div>
      </div>

      <div class="progress-text">
        <span>Baris {{ index }} dari {{ total }}</span>
        <span>{{ ((index / total) * 100)|round|int }}%</span>
      </div>

      <h3>Informasi Referensi</h3>
      <table class="read-only-table">
        {% for col_name in display_columns %}
        <tr>
          <th>{{ col_name }}</th>
          <td>{{ row[col_name] }}</td>
        </tr>
        {% endfor %}
      </table>

      <form action="/edit" method="POST">
        <div class="active-field">
          <label><strong>Edit Kolom [ {{ target_column }} ] :</strong></label>
          <!-- inputmode="text" mempermudah keyboard HP muncul secara optimal -->
          <input
            type="text"
            name="target_value"
            value="{{ row[target_column] }}"
            autofocus
            required
            autocomplete="off"
          />
        </div>
        <button type="submit">Simpan & Lanjut ➔</button>
      </form>
    </div>
  </body>
</html>
