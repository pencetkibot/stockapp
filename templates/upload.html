<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <!-- Meta Viewport Penting agar Tampilan Otomatis Menyesuaikan Ukuran Layar HP -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Upload File Excel</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        background-color: #f4f4f9;
        padding: 16px;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }
      .card {
        background: white;
        padding: 24px;
        border-radius: 12px;
        width: 100%;
        max-width: 480px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      }
      h2 {
        font-size: 1.4rem;
        margin-bottom: 20px;
        color: #333;
        text-align: center;
      }
      .form-group {
        margin-bottom: 18px;
      }
      label {
        display: block;
        margin-bottom: 6px;
        font-weight: 600;
        font-size: 0.95rem;
        color: #444;
      }
      input[type="text"],
      input[type="file"] {
        width: 100%;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-size: 1rem;
        background-color: #fff;
      }
      input[type="file"] {
        padding: 8px;
      }
      small {
        color: #666;
        font-size: 0.8rem;
        display: block;
        margin-top: 4px;
        line-height: 1.3;
      }
      button {
        background: #28a745;
        color: white;
        border: none;
        padding: 14px;
        border-radius: 8px;
        cursor: pointer;
        width: 100%;
        font-size: 1rem;
        font-weight: bold;
        margin-top: 10px;
        transition: background 0.2s;
      }
      button:active {
        background: #1e7e34;
      }
      .alert {
        background-color: #f8d7da;
        color: #721c24;
        padding: 12px;
        border-radius: 8px;
        margin-bottom: 18px;
        font-size: 0.9rem;
        line-height: 1.4;
      }

      /* Penyesuaian khusus layar sangat kecil */
      @media (max-width: 360px) {
        .card {
          padding: 16px;
        }
        h2 {
          font-size: 1.2rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>Upload File Excel</h2>

      {% if error %}
      <div class="alert">{{ error }}</div>
      {% endif %}

      <form action="/" method="POST" enctype="multipart/form-data">
        <div class="form-group">
          <label>1. Pilih File Excel (.xlsx):</label>
          <input type="file" name="file" accept=".xlsx, .xls" />
        </div>

        <div class="form-group">
          <label>2. Kolom Target (Diupdate):</label>
          <input
            type="text"
            name="target_column"
            placeholder="Contoh: Cek Fisik"
            value="Cek Fisik"
            required
          />
        </div>

        <div class="form-group">
          <label>3. Kolom Tampilan (Opsional):</label>
          <input
            type="text"
            name="display_columns"
            placeholder="Contoh: Material"
            value="Material, Material Description, Bin Locatn, ValType"
          />
          <small
            >*Pisahkan dengan koma. Kosongkan jika ingin menampilkan semua
            kolom.</small
          >
        </div>

        <button type="submit">Mulai Edit Data</button>
      </form>
    </div>
  </body>
</html>
